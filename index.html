<style>
  :root {
    --ink: #52514C; --ink-muted: #84827E; --bg: #FDF7E7; --accent: #F9E27D;
    --protein: #BD5536; --carbs: #D6A12E; --fat: #8A5A86; --green: #2E7D4F;
  }
  html { background: var(--bg); }
  body { font-family: 'Hanken Grotesk', system-ui, sans-serif; color: var(--ink); }
  .display { font-weight: 800; letter-spacing: -0.03em; }
  .serif-accent { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }

  /* The app's radial mesh, in CSS. */
  .mesh {
    background:
      radial-gradient(55% 45% at 18% 8%, #E5FAFBcc 0%, transparent 60%),
      radial-gradient(50% 40% at 85% 6%, #E6DFF1cc 0%, transparent 60%),
      radial-gradient(55% 45% at 8% 92%, #FEF8DCdd 0%, transparent 60%),
      radial-gradient(55% 45% at 92% 94%, #FFDCE9cc 0%, transparent 60%),
      radial-gradient(60% 55% at 50% 45%, #DECDEC99 0%, transparent 65%),
      #FDF7E7;
  }
  .mesh-panel {
    background:
      radial-gradient(60% 70% at 15% 20%, #E5FAFBd9 0%, transparent 65%),
      radial-gradient(55% 65% at 88% 15%, #E6DFF1d9 0%, transparent 60%),
      radial-gradient(60% 70% at 80% 90%, #FFDCE9c9 0%, transparent 60%),
      radial-gradient(55% 60% at 12% 88%, #FEF8DC 0%, transparent 60%),
      #FBF3DE;
  }
  .glass { background: rgba(255,255,255,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .glass-strong { background: rgba(255,255,255,0.7); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }

  @keyframes drift1 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(28px,-36px) rotate(7deg)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(-36px,26px) rotate(-6deg)} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(18px,44px) scale(1.05)} }
  .drift-a { animation: drift1 14s ease-in-out infinite; }
  .drift-b { animation: drift2 19s ease-in-out infinite; }
  .drift-c { animation: drift3 24s ease-in-out infinite; }
  @keyframes floatPhone { 0%,100%{transform:rotate(-2deg) translateY(0)} 50%{transform:rotate(-2deg) translateY(-10px)} }
  .float-phone { animation: floatPhone 7s ease-in-out infinite; }

  [data-reveal] { opacity: 0; transform: translateY(46px); filter: blur(9px);
    transition: opacity .9s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1), filter .9s cubic-bezier(.22,1,.36,1); }
  [data-reveal].is-in { opacity: 1; transform: translateY(0); filter: blur(0); }
  [data-panel] { transform: translateY(10%) scale(1.03); transition: transform 1.2s cubic-bezier(.22,1,.36,1); }
  [data-panel].is-in { transform: translateY(0) scale(1); }
  .word-reveal { display: inline-block; opacity: 0; filter: blur(8px); transform: translateY(22px);
    transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1), filter .7s cubic-bezier(.22,1,.36,1); }
  .is-in .word-reveal { opacity: 1; transform: translateY(0); filter: blur(0); }

  @keyframes coachBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .coach-card svg { animation: coachBob 2.6s ease-in-out infinite; }
  .coach-card:nth-child(2) svg { animation-delay: .4s } .coach-card:nth-child(3) svg { animation-delay: .8s }
  .coach-card:nth-child(4) svg { animation-delay: 1.2s }
  /* Hover = "let's go" flex: proud lean + pump, bicep arm pops out. */
  @keyframes coachFlex { 0%,100%{transform:rotate(-4deg) scale(1.06)} 50%{transform:rotate(-4deg) scale(1.12)} }
  .coach-card:hover svg { animation: coachFlex 1s ease-in-out infinite; }
  .flex-arm { opacity:0; transform-box:view-box; transform-origin:80% 68%;
    transform:rotate(30deg) scale(.4);
    transition:opacity .15s ease, transform .35s cubic-bezier(.34,1.56,.64,1); }
  .coach-card:hover .flex-arm { opacity:1; transform:rotate(0) scale(1); }
  /* Face swap: idle everywhere, party expression while flexing. */
  .face-party { display:none; }
  .coach-card:hover .face-idle { display:none; }
  .coach-card:hover .face-party { display:inline; }

  /* Hero UI pieces (Superhuman-style): glass fragments of the real app —
     a chat, the diary, the weekly check-in, a pill, a coach bubble —
     scattered over the hero. They pop in staggered, then hover forever,
     each on its own rhythm so the motion never syncs up. */
  .hero-piece { position:absolute;
    animation:bubbleIn .6s cubic-bezier(.34,1.56,.64,1) both; }
  .hero-piece .bubble-float { animation:bubbleDrift 5.5s ease-in-out infinite; }
  .hero-piece:nth-child(even) .bubble-float { animation-name:bubbleDriftAlt; }
  .hero-card { background:rgba(255,255,255,.55); backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.65);
    border-radius:22px; padding:14px 16px; box-shadow:0 12px 30px rgba(0,0,0,.08); }
  .hero-card h4 { display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; font-size:11px; font-weight:800; text-transform:uppercase;
    letter-spacing:.08em; color:#84827E; margin:0 0 6px; }
  .hero-card h4 .h4-val { font-size:12px; letter-spacing:0; text-transform:none;
    font-weight:700; color:#52514C; white-space:nowrap; }
  .hero-row { display:flex; justify-content:space-between; gap:16px;
    font-size:13px; color:#52514C; padding:6px 0; border-top:1px solid rgba(0,0,0,.05); }
  .hchat-msg { background:rgba(255,255,255,.8); border-radius:14px 14px 14px 4px;
    padding:8px 12px; font-size:13px; line-height:1.4; color:#52514C; max-width:88%; width:fit-content; }
  .hchat-user { background:#F9E27D; border-radius:14px 14px 4px 14px; margin-left:auto; }
  .hero-input { display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(255,255,255,.8); border-radius:999px; padding:8px 14px;
    font-size:12px; color:#84827E; margin-top:10px; }
  .hero-pill { display:inline-flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.55); backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.65);
    border-radius:999px; padding:9px 16px; font-size:13px; font-weight:700;
    color:#52514C; box-shadow:0 12px 30px rgba(0,0,0,.08); white-space:nowrap; }
  /* messenger-style coach quote: avatar outside, glass bubble with tail */
  .hero-bubble { max-width:300px; }
  .hero-bubble .bubble-float { display:flex; align-items:flex-end; gap:7px; }

  /* Hero phone: the include-section iPhone frame, holding a live chat with
     Sam. The screen is a mini app: header, autoscrolling thread, input bar. */
  .hero-phone { width:310px; border-radius:54px; background:#1c1c1e; padding:6px;
    box-shadow:0 30px 70px rgba(0,0,0,.28); pointer-events:auto; }
  .hero-phone-screen { border-radius:48px; overflow:hidden; aspect-ratio:9/18.4;
    display:flex; flex-direction:column; }
  .hero-phone-head { display:flex; align-items:center; gap:8px; padding:20px 18px 10px; }
  .hero-phone-head .ph-title { font-weight:800; letter-spacing:-.02em; font-size:15px; line-height:1.1; }
  .hero-phone-head .ph-sub { font-size:10.5px; color:#84827E; }
  .hero-phone-input { display:flex; align-items:center; gap:8px; margin:10px 12px 16px;
    background:rgba(255,255,255,.8); border-radius:999px; padding:9px 14px;
    font-size:12px; color:#84827E; box-shadow:0 4px 12px rgba(0,0,0,.05); }
  .hero-chat { flex:1; overflow-y:auto; pointer-events:auto; overscroll-behavior:contain;
    padding:8px 12px; display:flex; flex-direction:column; gap:9px;
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 16px, #000 calc(100% - 16px), transparent);
    mask-image:linear-gradient(to bottom, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
  .hero-chat::-webkit-scrollbar { display:none; }
  .hero-chat .bubble-body p { font-size:13.5px; }
  .hero-chat .bubble-user { font-size:13.5px; }
  .hero-chat .bubble-name { font-size:12px; }
  .hero-chat .bubble-avatar { width:30px; height:30px; }
  /* sent photo: image bubble on the user side (snap it); the emoji shows
     whenever the real shot is missing */
  .chat-photo { position:relative; align-self:flex-end; flex:0 0 170px; width:150px; height:170px;
    border-radius:18px 18px 5px 18px; overflow:hidden;
    border:1px solid rgba(255,255,255,.6); box-shadow:0 12px 30px rgba(0,0,0,.12);
    display:flex; align-items:center; justify-content:center; font-size:40px; }
  .chat-photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* full-width standalone card sheet inside the chat (recipe, meal) */
  .hero-chat .chat-card { width:100%; max-width:100%; padding:13px;
    border-radius:18px; }
  .hero-chat .chat-card::after { display:none; }
  /* consecutive coach bubbles: only the last shows the avatar, the rest
     are indented by the avatar's width, like a real messenger */
  .hchat-row { display:flex; align-items:flex-end; gap:6px; }
  .hchat-row.no-avatar { padding-left:36px; }
  .hchat-row.no-avatar .bubble-body { border-bottom-left-radius:18px; }
  .hchat-row.no-avatar .bubble-body::after { display:none; }
  .bubble-avatar { flex:0 0 auto; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.6); backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.65);
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .bubble-body { position:relative; background:rgba(255,255,255,.55);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.65);
    border-radius:18px; border-bottom-left-radius:5px;
    padding:8px 14px 10px; box-shadow:0 12px 30px rgba(0,0,0,.08); }
  .bubble-body::after { content:""; position:absolute; left:-10px; bottom:-1px;
    width:12px; height:12px; background:rgba(255,255,255,.55);
    clip-path:path('M12 0 C12 7.5 7 12 0 12 L12 12 Z'); }
  /* user message: yellow glass bubble, tail bottom-right */
  .bubble-user { position:relative; align-self:flex-end;
    background:rgba(249,226,125,.8); backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.55);
    border-radius:18px; border-bottom-right-radius:5px; padding:8px 14px;
    font-size:13px; line-height:1.45; color:#52514C; max-width:88%;
    box-shadow:0 12px 30px rgba(0,0,0,.08); }
  .bubble-user::after { content:""; position:absolute; right:-10px; bottom:-1px;
    width:12px; height:12px; background:rgba(249,226,125,.8);
    clip-path:path('M0 0 C0 7.5 5 12 12 12 L0 12 Z'); }
  .hero-bubble p { font-size:14px; line-height:1.45; color:#52514C; margin:0; }
  .hero-bubble .bubble-name { font-size:13px; font-weight:800; margin-bottom:1px; }
  @keyframes bubbleIn { from { opacity:0; transform:translateY(18px) scale(.8) } to { opacity:1; transform:none } }
  @keyframes bubbleDrift { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(4px,-9px) rotate(.6deg)} }
  @keyframes bubbleDriftAlt { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(-5px,-7px) rotate(-.6deg)} }
  @media (prefers-reduced-motion: reduce) {
    .hero-piece, .hero-piece .bubble-float { animation:none } }

  /* Real app screenshots in a consistent phone frame. When the PNG is
     missing, a faithful HTML recreation of the same screen shows instead
     (drop real screenshots into assets/ and they take over automatically). */
  .shot-frame {
    width: 280px; border-radius: 40px; overflow: hidden;
    border: 6px solid rgba(255,255,255,0.75);
    box-shadow: 0 30px 60px rgba(0,0,0,0.18), inset 0 0 0 1px rgba(0,0,0,0.06);
    background:
      radial-gradient(60% 50% at 20% 10%, #E5FAFBcc 0%, transparent 60%),
      radial-gradient(60% 50% at 85% 90%, #FFDCE9aa 0%, transparent 60%),
      #FDF7E7;
  }
  .shot-frame-sm { width: 250px; }
  .shot-frame img { display: block; width: 100%; height: auto; }
  .shot-fallback { display: none; padding: 16px 12px; font-size: 12px; line-height: 1.35; }
  .shot-frame.no-img img { display: none; }
  .shot-frame.no-img .shot-fallback { display: block; }
  .shot-head { display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #84827E; margin-bottom: 10px; }
  .shot-bubble-user { margin-left: 34px; background: rgba(255,255,255,.95); border-radius: 14px 14px 4px 14px;
    padding: 8px 11px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .shot-bubble-coach { margin-right: 34px; background: rgba(255,255,255,.8); border-radius: 14px 14px 14px 4px;
    padding: 8px 11px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-top: 8px; }
  .shot-card { background: rgba(255,255,255,.72); border-radius: 14px; padding: 11px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-top: 8px; }
  .shot-eyebrow { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #84827E; }
  .shot-kcal { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
  .shot-macros { display: flex; gap: 8px; font-size: 10px; font-weight: 700; margin-left: auto; }
  .shot-row { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px solid rgba(0,0,0,.05); }
  .shot-row:first-of-type { border-top: 0; }
  .shot-pill { background: #F9E27D; border-radius: 999px; text-align: center; font-weight: 800;
    font-size: 11px; padding: 6px 0; margin-top: 9px; }
  .shot-pill-ghost { background: rgba(255,255,255,.9); }
  .shot-note { font-size: 10px; color: #84827E; text-align: center; margin-top: 7px; }

  @media (prefers-reduced-motion: reduce) {
    .drift-a,.drift-b,.drift-c,.coach-card svg,.float-phone { animation: none !important; }
    [data-reveal],[data-panel] { transition: opacity .3s ease !important; transform: none !important; filter: none !important; }
    .word-reveal { transition: opacity .3s ease !important; transform: none !important; filter: none !important; }
  }
</style>
</head>

<!-- ================================================================ -->
<!-- VIEW: HOME                                                       -->
<!-- ================================================================ -->
<main id="view-home">

  <!-- HERO: full-screen manifesto over the mesh -->
  <header class="relative min-h-screen overflow-hidden flex flex-col mesh">
    <div class="absolute inset-0 bg-gradient-to-t from-[#FDF7E7] via-transparent to-transparent pointer-events-none"></div>

    <div class="relative z-10 flex-1 flex items-end">
      <div class="max-w-7xl mx-auto w-full px-6 sm:px-10 pb-[26vw] sm:pb-[19vw] lg:pb-[15vw] pt-40">
        <div class="max-w-5xl" data-reveal>
          <p class="text-xs uppercase tracking-[0.25em] text-[#84827E] font-semibold mb-8 flex items-center gap-3">
            <span class="safran-mark" data-mark="18"></span><span data-i="hero_eyebrow"></span>
          </p>
          <!-- Sized for the Dutch compound "AI-gezondheidscoach": one size
               step down from the template and a wider container, so the
               headline breaks at sentence boundaries, not inside words. -->
          <h1 class="display text-4xl sm:text-6xl lg:text-7xl leading-[1.0] text-[#52514C]" id="hero-title"></h1>
          <div class="mt-10 flex items-center gap-6" data-reveal style="transition-delay:700ms">
            <a href="/#download" data-nav="/#download" class="group inline-flex items-center gap-2.5 bg-[#F9E27D] hover:brightness-95 active:scale-95 text-[#52514C] font-bold text-base px-7 py-3.5 rounded-full transition-all duration-300 shadow-xl shadow-[#F9E27D]/50">
              <span data-i="nav_cta"></span>
              <svg class="w-4 h-4 transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
            </a>
            <a href="/#coaches" data-nav="/#coaches" class="text-sm text-[#84827E] hover:text-[#52514C] border-b border-black/15 hover:border-black/60 pb-0.5 transition-colors duration-300" data-i="hero_cta2"></a>
          </div>
        </div>
      </div>
    </div>

    <!-- scrollable chat with Sam, floating over the hero. The inner div
         mirrors the content container (max-w-7xl + px-10) so the chat sits
         at the same inset from the right edge as the headline from the
         left. Desktop only. -->
    <div class="absolute inset-0 z-10 hidden lg:block pointer-events-none">
      <div id="hero-bubbles" class="max-w-7xl mx-auto px-6 sm:px-10 h-full relative"></div>
    </div>

    <!-- giant cropped wordmark. Centered via inset-x-0 (NOT a translate
         transform: the parallax script owns this element's transform). -->
    <div class="absolute -bottom-[4vw] inset-x-0 z-[5] pointer-events-none overflow-hidden select-none" data-parallax="0.5">
      <p class="display text-[19.5vw] leading-none text-center text-[#52514C]/[0.08] whitespace-nowrap">SAFRAN</p>
    </div>
  </header>

  <!-- EAT LIKE YOUR FAVOURITE INFLUENCERS: imported recipe grid -->
  <section id="influencers" class="pt-16 sm:pt-24">
    <div class="max-w-7xl mx-auto px-6 sm:px-10">
      <div class="max-w-3xl mx-auto text-center mb-12" data-reveal>
        <h2 class="display text-4xl sm:text-6xl leading-[1.02]" id="infl-title"></h2>
        <p class="text-lg text-[#84827E] mt-5 max-w-xl mx-auto" data-i="infl_sub"></p>
      </div>
      <!-- Three explicit column stacks (no CSS-columns auto-balancing, which
           kept eating the stagger): outer columns start one step below the
           middle one, cards flow with one constant feed gap. -->
      <div id="infl-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </div>
  </section>

  <!-- WHAT DOES SAFRAN INCLUDE: Cal-AI-style interactive showcase.

bruikt worden."], ["Geen garanties", "Safran wordt geleverd zoals hij is. Resultaten hangen van jou af; we garanderen geen gewichtsverandering of gezondheidsuitkomsten. Voor zover de wet het toelaat is de aansprakelijkheid van Safran beperkt tot wat je in de afgelopen 12 maanden voor de dienst hebt betaald."], ["Stoppen en wijzigingen", "Je kunt altijd stoppen door je account te verwijderen. Accounts die deze voorwaarden schenden kunnen we blokkeren. We kunnen deze voorwaarden bijwerken; belangrijke wijzigingen melden we in de app. Nederlands recht is van toepassing. Vragen: support@safran.app."]], "updated": "Laatst bijgewerkt: 15 juli 2026"},

/* Slow ping-pong autoscroll through a conversation; pauses while the
 * visitor hovers so they can read or scroll themselves. Per-screen: the
 * loop self-cancels once its box leaves the DOM (e.g. language switch). */
function startChatAutoScroll(box) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let paused = false;
  box.addEventListener('pointerenter', () => { paused = true; });
  box.addEventListener('pointerleave', () => { paused = false; });
  let dir = 1;
  let wait = 140; // ~2.3s pause before starting / at each end
  const step = () => {
    if (!box.isConnected) return; // replaced by a re-render: stop this loop
    if (!paused) {
      if (wait > 0) wait--;
      else {
        box.scrollTop += 0.4 * dir;
        const max = box.scrollHeight - box.clientHeight;
        if (dir === 1 && box.scrollTop >= max - 1) { dir = -1; wait = 170; }
        else if (dir === -1 && box.scrollTop <= 1) { dir = 1; wait = 170; }
      }
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

    <div class="bg-white/70 backdrop-blur rounded-3xl border border-white/70 p-7 shadow-xl shadow-black/5" data-reveal style="transition-delay:${i * 90}ms">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-[#52514C]" style="background:${item.c}">${item.name[0]}</div>
        <div>
          <p class="font-bold text-[15px]">${item.name}</p>
          <p class="text-[11px] text-[#D6A12E] tracking-wide">★★★★★</p>
        </div>
      </div>
      <p class="text-[15px] leading-relaxed text-[#52514C]">“${item.text}”</p>
    </div>`;
  const items = t('testi_items');
  grid.innerHTML = `
    <div class="grid sm:grid-cols-3 gap-5">${items.slice(0, 3).map(card).join('')}</div>
    <div class="grid sm:grid-cols-2 gap-5 mt-5 lg:max-w-[66%] mx-auto">${items.slice(3, 5).map(card).join('')}</div>`;
  grid.querySelectorAll('[data-reveal]').forEach(observeReveal);
}

/* ============================ router ============================ */
const views = { home: 'view-home', legal: 'view-legal', share: 'view-share' };
let legalKind = 'privacy';
let shareToken = null;

/* file:// (local preview) can't use pathname routing, so doc routes ride the
 * hash there (#/privacy); hosted, they use real paths (/privacy). */
const FILE_MODE = location.protocol === 'file:';

function currentRoutePath() {
  if (FILE_MODE) {
    const h = location.hash;
    return h.startsWith('#/') ? h.slice(1) : '/';
  }
  return location.pathname.replace(/\/+$/, '') || '/';
}

function route() {
  const path = currentRoutePath();
  const rMatch = path.match(/^\/r\/([0-9a-f-]{36})$/i);
  let view = 'home';
  if (path === '/privacy' || path === '/terms') { view = 'legal'; legalKind = path.slice(1); }
  else if (rMatch) { view = 'share'; shareToken = rMatch[1]; }
  Object.values(views).forEach((id) => document.getElementById(id).classList.add('hidden'));
  document.getElementById(views[view]).classList.remove('hidden');
  if (view === 'legal') renderLegal();
  if (view === 'share') loadShare();
  window.scrollTo(0, 0);
}

function goTo(dest) {
  const [path, anchor] = dest.split('#');
  // Same-page section anchor: make sure home is visible, then scroll.
  if (anchor) {
    if (currentRoutePath() !== '/') {
      if (FILE_MODE) history.replaceState({}, '', location.pathname);
      else history.pushState({}, '', '/');
      route();
    }
    document.getElementById(anchor)?.scrollIntoView({ behavior: 'smooth' });
    return;
  }
  // Document route (/, /privacy, /terms).
  if (FILE_MODE) {
    history.pushState({}, '', location.pathname + (path === '/' ? '' : `#${path}`));
  } else {
    history.pushState({}, '', path || '/');
  }
  route();
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-nav]');
  if (!a) return;
  e.preventDefault();
  goTo(a.dataset.nav);
});
window.addEventListener('popstate', route);
window.addEventListener('hashchange', () => { if (FILE_MODE) route(); });

/* ============================ legal ============================ */
function renderLegal() {
  const data = T[lang][legalKind];
  if (!data) return;
  document.getElementById('legal-title').textContent = data.title;
  document.getElementById('legal-intro').textContent = data.intro;
  document.getElementById('legal-updated').textContent = data.updated;
  document.getElementById('legal-sections').innerHTML = data.sections
    .map(
      ([title, body]) => `
    <div class="bg-white/70 rounded-2xl border border-white/70 p-6 shadow-sm">
      <h2 class="display text-lg mb-2">${title}</h2>
      <p class="text-[#84827E] leading-relaxed text-[15px]">${body}</p>
    </div>`
    )
    .join('');
}

/* ============================ share ============================ */
let shareLoaded = null;
function renderShareTexts() { if (shareLoaded) renderShareRecipe(shareLoaded); }
async function loadShare() {
  const loading = document.getElementById('share-loading');
  const failed = document.getElementById('share-failed');
  const box = document.getElementById('share-recipe');
  loading.classList.remove('hidden'); failed.classList.add('hidden'); box.classList.add('hidden');
  try {
    const res = await fetch(SHARE_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: shareToken, action: 'get', language: lang }),
    });
    if (!res.ok) throw new Error(String(res.status));
    shareLoaded = await res.json();
    renderShareRecipe(shareLoaded);
  } catch {
    loading.classList.add('hidden');
    failed.classList.remove('hidden');
  }
}
function renderShareRecipe(r) {
  document.getElementById('share-loading').classList.add('hidden');
  document.getElementById('share-recipe').classList.remove('hidden');
  const img = document.getElementById('share-img');
  if (r.image_path) { img.src = RECIPE_IMG + r.image_path; img.classList.remove('hidden'); }
  document.getElementById('share-title').textContent = r.title;
  document.getElementById('share-meta').textContent =
    (r.calories != null ? `${Math.round(r.calories)} kcal · ` : '') + T[lang].servings(r.servings);
  document.getElementById('share-open').href = `safran://shared-recipe/${shareToken}`;
}

/* ============================ motion ============================ */
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const io = new IntersectionObserver(
  (entries) => entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }),
  { threshold: 0.15 }
);
function observeReveal(el) { io.observe(el); }
document.querySelectorAll('[data-reveal],[data-panel]').forEach(observeReveal);

/* Parallax. Offset derives from the PARENT's viewport position (the parent
 * is unaffected by this element's transform, so no feedback loop) and moves
 * continuously through [-speed*200, +speed*200] — the template's scrollY
 * modulo snapped every 600px and clobbered layout transforms. */
if (!reduced) {
  const layers = document.querySelectorAll('[data-parallax]');
  let ticking = false;
  const applyParallax = () => {
    layers.forEach((el) => {
      const parent = el.parentElement || el;
      const rect = parent.getBoundingClientRect();
      if (rect.bottom < -100 || rect.top > innerHeight + 100) return;
      const speed = parseFloat(el.dataset.parallax);
      const progress = (innerHeight - rect.top) / (innerHeight + rect.height);
      const clamped = Math.min(Math.max(progress, 0), 1);
      el.style.transform = `translateY(${((clamped - 0.5) * speed * 400).toFixed(1)}px)`;
    });
    ticking = false;
  };
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(applyParallax); ticking = true; }
  }, { passive: true });
  applyParallax();
}

function wrapWords(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) { if (n.textContent.trim() !== '') nodes.push(n); }
  let i = 0;
  nodes.forEach((tn) => {
    const parts = tn.textContent.split(/(\s+)/);
    const frag = document.createDocumentFragment();
    parts.forEach((part) => {
      if (part.trim() === '') { frag.appendChild(document.createTextNode(part)); return; }
      const span = document.createElement('span');
      span.className = 'word-reveal';
      span.style.transitionDelay = `${i * 45}ms`;
      span.textContent = part;
      frag.appendChild(span);
      i++;
    });
    tn.parentNode.replaceChild(frag, tn);
  });
}

/* ============================ boot ============================ */
document.getElementById('lang-toggle').addEventListener('click', () => {
  lang = lang === 'en' ? 'nl' : 'en';
  localStorage.setItem('safran_lang', lang);
  applyLang();
});
applyLang();
route();
