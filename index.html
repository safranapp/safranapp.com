<style>
  :root {
    --ink: #52514C; --ink-muted: #84827E; --bg: #FDF7E7; --accent: #F9E27D;
    --protein: #BD5536; --carbs: #D6A12E; --fat: #8A5A86; --green: #2E7D4F;
  }
  /* The page background: one fixed mesh gradient on <html>, brand pastels
     over cream. <body> stays transparent so it never covers it. */
  html {
    background:
      radial-gradient(50% 50% at -20% -20%, #E5FAFBeb 0%, #E5FAFB81 55%, transparent 100%),
      radial-gradient(50% 50% at 90% 10%,   #E6DFF1eb 0%, #E6DFF181 55%, transparent 100%),
      radial-gradient(55% 55% at -10% 80%,  #FEF8DCeb 0%, #FEF8DC81 55%, transparent 100%),
      radial-gradient(50% 50% at 85% 90%,   #FFDCE9eb 0%, #FFDCE981 55%, transparent 100%),
      radial-gradient(60% 60% at 50% 50%,   #DECDECeb 0%, #DECDEC81 55%, transparent 100%),
      /* cream base as its own layer, so the *colour* below can be the shade
         iOS Safari tints its top bar with (it samples background-color, not
         the gradient images, and ignores <meta theme-color>) */
      linear-gradient(#FDF7E7, #FDF7E7);
    background-color: #EFE8E9;
    background-attachment: fixed;
  }
  html, body { overflow-x: clip; }

  /* Phones: iOS Safari paints its top and bottom bars in ONE flat colour
     sampled from background-color (it ignores <meta theme-color> here), and
     a gradient cannot reach into that chrome. So on mobile the background is
     a viewport-pinned layer that begins and ends in exactly that colour and
     carries the brand pastels through the middle. Pinned, not scrolling, so
     the two bands stay under the bars at every scroll position. */
  @media (max-width: 767px) {
    html { background: #EFE8E9; }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      /* Two hues only. Four pastels at phone width read as a rainbow, so the
         cyan and yellow are dropped and what is left is one lilac bloom high
         and one blush low, both wide and faint enough to look like light
         rather than bands. */
      background:
        radial-gradient(120% 45% at 82% 22%, #E6DFF199 0%, transparent 100%),
        radial-gradient(120% 45% at 18% 82%, #FFDCE980 0%, transparent 100%),
        linear-gradient(to bottom, #EFE8E9 0%, #F7F2EC 16%, #F7F2EC 84%, #EFE8E9 100%);
    }
  }


  body { font-family: 'Hanken Grotesk', system-ui, sans-serif; color: var(--ink); }
  .display { font-weight: 800; letter-spacing: -0.03em; }
  .serif-accent { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em;
    /* optical centring: italics lean right and end on a period, so the line
       reads right-heavy when geometrically centred; nudge it back a hair */
    display: inline-block; transform: translateX(-0.04em); }

  /* The app's radial mesh (MeshBackground.STOPS), in CSS: fallback for the
     WebGL canvas and the fill of the phone screens. */
  .mesh {
    background:
      radial-gradient(50% 50% at -20% -20%, #E5FAFBeb 0%, #E5FAFB81 55%, transparent 100%),
      radial-gradient(50% 50% at 90% 10%,   #E6DFF1eb 0%, #E6DFF181 55%, transparent 100%),
      radial-gradient(55% 55% at -10% 80%,  #FEF8DCeb 0%, #FEF8DC81 55%, transparent 100%),
      radial-gradient(50% 50% at 85% 90%,   #FFDCE9eb 0%, #FFDCE981 55%, transparent 100%),
      radial-gradient(60% 60% at 50% 50%,   #DECDECeb 0%, #DECDEC81 55%, transparent 100%),
      #FDF7E7;
  }
  body.mesh { background-attachment: fixed; background-color: var(--bg); }
  .mesh-panel {
    background:
      radial-gradient(60% 70% at 15% 20%, #E5FAFBd9 0%, transparent 65%),
      radial-gradient(55% 65% at 88% 15%, #E6DFF1d9 0%, transparent 60%),
      radial-gradient(60% 70% at 80% 90%, #FFDCE9c9 0%, transparent 60%),
      radial-gradient(55% 60% at 12% 88%, #FEF8DC 0%, transparent 60%),
      #FBF3DE;
  }
  .glass { background: rgba(255,255,255,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .glass-strong { background: rgba(255,255,255,0.7); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }

  @keyframes drift1 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(28px,-36px) rotate(7deg)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(-36px,26px) rotate(-6deg)} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(18px,44px) scale(1.05)} }
  .drift-a { animation: drift1 14s ease-in-out infinite; }
  .drift-b { animation: drift2 19s ease-in-out infinite; }
  .drift-c { animation: drift3 24s ease-in-out infinite; }
  @keyframes floatPhone { 0%,100%{transform:rotate(-2deg) translateY(0)} 50%{transform:rotate(-2deg) translateY(-10px)} }
  .float-phone { animation: floatPhone 7s ease-in-out infinite; }

  [data-reveal] { opacity: 0; transform: translateY(46px); filter: blur(9px);
    transition: opacity .9s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1), filter .9s cubic-bezier(.22,1,.36,1); }
  [data-reveal].is-in { opacity: 1; transform: translateY(0); filter: blur(0); }
  [data-panel] { transform: translateY(10%) scale(1.03); transition: transform 1.2s cubic-bezier(.22,1,.36,1); }
  [data-panel].is-in { transform: translateY(0) scale(1); }
  .word-reveal { display: inline-block; opacity: 0; filter: blur(8px); transform: translateY(22px);
    transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1), filter .7s cubic-bezier(.22,1,.36,1); }
  .is-in .word-reveal { opacity: 1; transform: translateY(0); filter: blur(0); }

  @keyframes coachBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .coach-card svg { animation: coachBob 2.6s ease-in-out infinite; }
  .coach-card:nth-child(2) svg { animation-delay: .4s } .coach-card:nth-child(3) svg { animation-delay: .8s }
  .coach-card:nth-child(4) svg { animation-delay: 1.2s }
  /* Hover = "let's go" flex: proud lean + pump, bicep arm pops out. */
  @keyframes coachFlex { 0%,100%{transform:rotate(-4deg) scale(1.06)} 50%{transform:rotate(-4deg) scale(1.12)} }
  .coach-card:hover svg { animation: coachFlex 1s ease-in-out infinite; }
  .flex-arm { opacity:0; transform-box:view-box; transform-origin:80% 68%;
    transform:rotate(30deg) scale(.4);
    transition:opacity .15s ease, transform .35s cubic-bezier(.34,1.56,.64,1); }
  .coach-card:hover .flex-arm { opacity:1; transform:rotate(0) scale(1); }
  /* Face swap: idle everywhere, party expression while flexing. */
  .face-party { display:none; }
  .coach-card:hover .face-idle { display:none; }
  .coach-card:hover .face-party { display:inline; }

  /* "What you can do" runway: 4 chapters × 80vh of scroll + the stage. The
     phone is sized from the viewport height so title + phone + cards always
     fit one screen. Cards: title always visible, body unfolds when active. */
  .how-runway { height: 420vh; }
  /* Mobile/tablet (<lg): same scroll-driven story, one card at a time.
     The stage stays pinned: phone on top (sized to leave room for a card),
     the ACTIVE card below it, dots underneath. Non-active cards are hidden. */
  @media (max-width: 1023px) {
    .how-runway { height: 340vh; }
    /* Fixed geometry so the phone never moves between chapters: the stage
       starts below the nav, the phone takes the height that is left after a
       fixed-height title card + dots, and the card box has a constant height. */
    .how-stage { justify-content: flex-start; padding-top: 3.75rem; }
    .how-stage > div { padding-top: 0 !important; }
    /* The phone gets what is left of the viewport after the nav gap above and
       the title + dots that now sit between them and it; derive the width from
       that height so the frame can never run past the fold and collide with
       the next section. */
    .how-phone { width: calc((100vh - 3.75rem - 6.75rem) * 1170 / 2472); max-width: 340px; }
    @supports (height: 100svh) {
      .how-phone { width: calc((100svh - 3.75rem - 6.75rem) * 1170 / 2472); }
    }
    #include-cards { min-height: 4.5rem; display: flex; align-items: center; justify-content: center; }
    /* .how-stage prefix: beats the base rules that follow later in this sheet.
       On mobile the chapter is plain centred text under the phone: no card
       chrome, no number, no body. */
    .how-stage .include-card:not(.is-active) { display: none; }
    .how-stage .include-card.is-active { width: 100%; transform: none; animation: cardIn .45s cubic-bezier(.22,1,.36,1) both;
      background: transparent !important; border-color: transparent !important; box-shadow: none !important; padding: 0 1rem; }
    .how-stage .include-card > .flex { justify-content: center; text-align: center; }
    .how-stage .include-card > .flex > span { display: none; }          /* the "01" index */
    .how-stage .include-card h3 { font-size: 1.375rem; line-height: 1.25; }
    .how-stage .include-body { display: none; }
    /* Chapter title (and dots) above the phone: the label has to arrive
       before the screenshot it describes, not after it. */
    .how-cards { order: 1; }
    .how-sticky-phone { order: 2; margin-top: .25rem; }
    .include-dots { margin-top: 10px; margin-bottom: 6px; }
    #include-cards { min-height: 3.75rem; }
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .include-dots { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
  .include-dots span { width: 6px; height: 6px; border-radius: 999px; background: rgba(82,81,76,.18); transition: background .3s, width .3s; }
  .include-dots span.is-on { background: #52514C; width: 18px; }
  @media (min-width: 1024px) { .include-dots { display: none; } }
  /* Same 330px phone as before; it only gives way (down to 290px) on short
     windows, and the stage may then crop a little at the edges. */
  @media (min-width: 1024px) { .how-phone { width: clamp(290px, calc((100vh - 7rem) * 1170 / 2472), 340px); } }
  .include-shot { opacity: 0; transition: opacity .5s ease; }
  .include-shot.is-on { opacity: 1; }
  .include-card { cursor: pointer; transition: background-color .5s, box-shadow .5s, border-color .5s, transform .5s cubic-bezier(.22,1,.36,1); }
  .include-card.is-active { transform: scale(1.02); }
  .include-body { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .55s cubic-bezier(.22,1,.36,1), opacity .35s, margin-top .55s; }
  .include-body > p { overflow: hidden; }
  .include-card.is-active .include-body { grid-template-rows: 1fr; opacity: 1; margin-top: .6rem; }
  @media (prefers-reduced-motion: reduce) {
    .how-runway { height: auto; padding: 4rem 0; }
    .how-stage { position: relative; height: auto; }
    .include-body { grid-template-rows: 1fr; opacity: 1; margin-top: .6rem; }
  }


  /* Recipes: the cards are fanned like a hand of cards, on every screen size.
     Each card gets its own --tx/--ty/--rot.
     Below lg only the first three cards show (the deck is 240px wide cards);
     from lg all five fan out in one row, so the section stays one screen tall. */
  .infl-deck { position: relative; margin: 0 auto; height: 420px; max-width: 420px; }
  .infl-item { position: absolute; top: 12px; left: 50%; width: 240px; transform-origin: 50% 100%;
    transform: translateX(-50%) translate(var(--tx, 0), var(--ty, 0)) rotate(var(--rot, 0deg));
    transition: transform .5s cubic-bezier(.22,1,.36,1), z-index 0s .1s; z-index: var(--z, 1); }
  .infl-item [data-reveal] { transition-delay: 0s !important; }
  /* Motion: the deck starts as one pile and fans out when it scrolls into
     view (centre card first, outer cards trailing). */
  .infl-deck:not(.is-open) .infl-item { --tx: 0; --ty: 40px; --rot: 0deg; }
  .infl-deck.is-open .infl-item { transition-duration: .9s; transition-delay: var(--d, 0s); }
  .infl-0 { --d: .1s; }  .infl-1 { --d: 0s; }  .infl-2 { --d: .1s; }
  .infl-0 { --tx: -34%; --rot: -9deg; --z: 1; }
  .infl-1 { --ty: -6px; --z: 3; }
  .infl-2 { --tx: 34%; --rot: 9deg; --z: 2; }
  @media (max-width: 420px) { .infl-deck { height: 380px; } .infl-item { width: 210px; } }
  @media (min-width: 1024px) {
    .infl-deck { height: 500px; max-width: 1100px; }
    .infl-item { width: 250px; top: 0; }
    .infl-0 { --tx: calc(-1 * min(380px, 30vw)); --ty: 64px; --rot: -13deg; --z: 1; }
    .infl-1 { --tx: calc(-1 * min(190px, 15vw)); --ty: 22px; --rot: -7deg;  --z: 2; }
    .infl-2 { --tx: 0;                            --ty: 0;    --rot: 0deg;   --z: 3; }
    .infl-3 { --tx: min(190px, 15vw);             --ty: 22px; --rot: 7deg;   --z: 2; }
    .infl-4 { --tx: min(380px, 30vw);             --ty: 64px; --rot: 13deg;  --z: 1; }
    .infl-0 { --d: .2s; } .infl-1 { --d: .1s; } .infl-2 { --d: 0s; }
    .infl-3 { --d: .1s; } .infl-4 { --d: .2s; }
  }


  /* Coaches on phones: compact cards (the avatar SVG scales with its box). */
  @media (max-width: 639px) {
    .coach-card { padding: 1rem .75rem; }
    .coach-card svg { width: 56px; height: 56px; }
    .coach-card h3 { font-size: 1.125rem; }
    .coach-card p:first-of-type { font-size: 10px; margin-bottom: .5rem; }
    .coach-card p:last-of-type { font-size: 13px; line-height: 1.45; }
  }

  /* Hero scrollytelling. The runway height is the scroll budget: 100vh of
     stage + 180vh of story (zoom, then the chat). */
  .hero-runway { height: 280vh; }
  /* svh = the viewport with the browser chrome SHOWN, so these do not change
     when iOS collapses the URL bar mid-scroll (100vh does, which makes the
     sticky stage and the zoom target jump). */
  @supports (height: 100svh) {
    .hero-runway { height: 280svh; }
    .hero-stage { height: 100svh; }
    .how-stage { height: 100svh; }
  }
  #hero-phone-wrap { transform-origin: 50% 0; }
  @media (prefers-reduced-motion: reduce) {
    .hero-runway { height: auto; padding-bottom: 6rem; }
    .hero-stage { position: relative; height: auto; }
    .hero-chat { pointer-events: auto !important; overflow-y: auto !important; }
  }
  /* Hero phone: the include-section iPhone frame, holding a live chat with
     Sam. The screen is a mini app: header, autoscrolling thread, input bar. */
  .hero-phone { width:300px; border-radius:54px; background:#1c1c1e; padding:6px;
    box-shadow:0 30px 70px rgba(0,0,0,.28); pointer-events:auto; }
  @media (max-width: 767px) { .hero-phone { padding:4px; } }
  .hero-phone-screen { position:relative; border-radius:48px; overflow:hidden; aspect-ratio:9/18.4; --z: 0.7385; }
  /* after the base rule on purpose: same specificity, later wins */
  @media (max-width: 640px) { .hero-phone { width:260px; border-radius:46px; } .hero-phone-screen { border-radius:41px; --z: 0.6359; } }
  /* THE APP AT 1:1. Everything inside .app is laid out at the app's native
     390pt width (× 797pt = the frame's 9:18.4 ratio) with the app's own
     tokens (typography, radii, spacing from app/src/theme/tokens.ts and the
     chat components), then transform-scaled to the frame: --z = frame width
     / 390. Proportions therefore match the real app by construction. */
  .app { position:absolute; top:0; left:0; width:390px; height:797px; transform:scale(var(--z)); transform-origin:0 0;
    display:flex; flex-direction:column; font-size:16px; line-height:26px; color:#52514C; }
  .app-head { display:flex; align-items:center; gap:12px; padding:30px 20px 16px; }          /* ScreenHeader under the safe area */
  .app-head .ph-title { font-size:20px; font-weight:800; letter-spacing:.6px; line-height:24px; text-transform:uppercase; }  /* h1 */
  .app-head .ph-sub { font-size:12px; letter-spacing:.24px; line-height:16px; color:#84827E; font-weight:500; } /* caption */
  .app-head .ph-avatar { margin-left:auto; width:38px; height:38px; border-radius:999px; background:#52514C;
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
  .hero-chat { flex:1; overflow-y:hidden; pointer-events:none; overscroll-behavior:contain;
    padding:8px 20px 24px; display:flex; flex-direction:column; gap:10px; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 16px, #000 calc(100% - 16px), transparent);
    mask-image:linear-gradient(to bottom, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
  .hero-chat::-webkit-scrollbar { display:none; }
  /* ChatBubble: AI on muted surface, leading, 6px notch top-left; user on
     white 90%, trailing, notch top-right. bodyMd 16/24, padding 14, radii.lg 22. */
  .bubble-body { align-self:flex-start; max-width:82%; background:rgba(248,248,250,.88);
    border-radius:22px; border-top-left-radius:6px; padding:14px; }
  .bubble-body p { margin:0; font-size:16px; line-height:24px; }
  .bubble-user { align-self:flex-end; max-width:82%; background:rgba(255,255,255,.9);
    border-radius:22px; border-top-right-radius:6px; padding:14px; font-size:16px; line-height:24px; }
  /* cards (meal breakdown, plan): GlassCard — white 70%, radii.lg, padding 14 */
  .hero-chat .chat-card { align-self:stretch; max-width:100%; background:rgba(255,255,255,.7);
    border-radius:22px; padding:14px; }
  /* ChatInput: white-glass pill, 16px text, 40pt round mic, 20px camera icon */
  .app-input { display:flex; align-items:center; gap:12px; margin:10px 20px 26px; background:rgba(255,255,255,.8);
    border-radius:999px; padding:6px 6px 6px 16px; font-size:16px; color:#84827E; box-shadow:0 4px 12px rgba(0,0,0,.05); }
  .app-input .mic { width:40px; height:40px; border-radius:999px; background:rgba(255,255,255,.9);
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  /* app buttons: 44pt pills, labelMd 14/700 */
  .app-btn { flex:1; height:44px; display:flex; align-items:center; justify-content:center; border-radius:999px;
    font-size:14px; font-weight:700; letter-spacing:.14px; background:rgba(255,255,255,.9); }
  .app-btn.primary { background:#F9E27D; box-shadow:0 4px 12px rgba(249,226,125,.5); font-weight:800; }
  @keyframes bubbleIn { from { opacity:0; transform:translateY(18px) scale(.8) } to { opacity:1; transform:none } }

  /* Real app screenshots in a consistent phone frame. When the PNG is
     missing, a faithful HTML recreation of the same screen shows instead
     (drop real screenshots into assets/ and they take over automatically). */
  .shot-frame {
    width: 280px; border-radius: 40px; overflow: hidden;
    border: 6px solid rgba(255,255,255,0.75);
    box-shadow: 0 30px 60px rgba(0,0,0,0.18), inset 0 0 0 1px rgba(0,0,0,0.06);
    background:
      radial-gradient(60% 50% at 20% 10%, #E5FAFBcc 0%, transparent 60%),
      radial-gradient(60% 50% at 85% 90%, #FFDCE9aa 0%, transparent 60%),
      #FDF7E7;

/* Scroll-driven hero. progress p in [0,1] over the runway:
 *   0   – .35  zoom: phone scales up and slides to the vertical centre of
 *              the stage while the copy fades up and out
 *   .35 – 1    story: the chat's scrollTop follows p, so the conversation
 *              plays as the visitor scrolls (and rewinds when they scroll up)
 * Everything is measured, nothing hard-coded: the phone's final scale is
 * capped so it always fits the viewport with a margin. */
const heroScroll = (() => {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let runway, stage, copy, wrap, hint, chat;
  let copyH = 0, phoneH = 0, phoneTop = 0, endScale = 1, endShift = 0, maxScroll = 0, vh = innerHeight;
  const ZOOM_END = 0.35;
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  function measure() {
    runway = document.getElementById('hero'); stage = runway?.querySelector('.hero-stage');
    copy = document.getElementById('hero-copy'); wrap = document.getElementById('hero-phone-wrap');
    hint = document.getElementById('hero-hint'); chat = wrap?.querySelector('.hero-chat');
    if (!runway || !wrap) return;
    wrap.style.transform = ''; copy.style.transform = '';
    vh = innerHeight;   // frozen here on purpose: see the resize handler
    copyH = copy.getBoundingClientRect().height;
    const pr = wrap.getBoundingClientRect(); const sr = stage.getBoundingClientRect();
    phoneH = pr.height; phoneTop = pr.top - sr.top;
    // The nav capsule is fixed at the top: the phone lives in the band below
    // it. Scale to fit that band (it may shrink on short windows), never above 1.18.
    const nav = document.querySelector('nav');
    const bandTop = (nav ? nav.getBoundingClientRect().bottom : 0) + 16;
    const band = vh - bandTop - 24;
    endScale = clamp(band / phoneH, 0.55, 1.18);
    // translate so the (top-origin) scaled phone is centred in the band
    endShift = bandTop + (band - phoneH * endScale) / 2 - phoneTop;
    maxScroll = chat ? chat.scrollHeight - chat.clientHeight : 0;
  }
  function progress() {
    const r = runway.getBoundingClientRect();
    return clamp(-r.top / (r.height - vh), 0, 1);
  }
  function apply() {
    if (!runway || !wrap || reduced) return;
    const p = progress();
    const z = ease(clamp(p / ZOOM_END, 0, 1));
    const scale = 1 + (endScale - 1) * z;
    const outro = ease(clamp((p - 0.85) / 0.15, 0, 1));
    wrap.style.transform = `translateY(${(endShift * z - 32 * outro).toFixed(1)}px) scale(${(scale * (1 - 0.04 * outro)).toFixed(3)})`;
    copy.style.opacity = String(1 - z);
    copy.style.transform = `translateY(${(-40 * z).toFixed(1)}px)`;
    copy.style.pointerEvents = z > 0.6 ? 'none' : '';
    if (hint) hint.style.opacity = String(1 - clamp(p / 0.12, 0, 1));
    if (chat && maxScroll > 0) {
      const c = clamp((p - ZOOM_END) / (1 - ZOOM_END), 0, 1);
      chat.scrollTop = c * maxScroll;
    }
  }
  let ticking = false;
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { apply(); ticking = false; }); } }, { passive: true });
  // On iOS the URL bar collapsing fires resize with a height-only change;
  // re-measuring there makes the phone jump. Only a width change (rotation,
  // desktop resize) is a real layout change.
  let lastW = innerWidth;
  addEventListener('resize', () => {
    if (innerWidth === lastW) return apply();
    lastW = innerWidth; measure(); apply();
  });
  addEventListener('orientationchange', () => { setTimeout(() => { measure(); apply(); }, 200); });
  new ResizeObserver(() => { measure(); apply(); }).observe(document.getElementById('hero-phone'));
  return { measure, apply };
})();

function setTitle(id, text) {
  const el = document.getElementById(id);
  el.innerHTML = accentHtml(text);
  wrapWords(el);
  el.classList.add('is-in');
}

/* ================= "What you can do": scroll-driven chapters ================= */
/* Runway progress p in [0,1] is split evenly over the chapters; the active
 * chapter owns the phone, its card unfolds, and (chat chapters) the thread's
 * scrollTop follows the within-chapter progress. Clicking a card scrolls the
 * page to the middle of that chapter's slice. */
let includeIdx = -1;
function renderInclude() {
  preloadIncludeShots();
  const items = t('include_items');
  document.getElementById('include-cards').innerHTML = items
    .map(
      ([title, body], i) => `
    <div data-include="${i}" class="include-card rounded-2xl border px-5 py-4 sm:px-6 sm:py-5 bg-white/45 border-white/60">
      <div class="flex items-baseline gap-4">
        <span class="text-[11px] font-bold tracking-[0.2em] text-[#84827E] shrink-0">0${i + 1}</span>
        <h3 class="display text-lg sm:text-2xl">${title}</h3>
      </div>
      <div class="include-body"><p class="text-[#84827E] leading-relaxed text-[15px] sm:text-base pl-8">${body}</p></div>
    </div>`
    )
    .join('');
  document.getElementById('include-dots').innerHTML = items.map(() => '<span></span>').join('');
  includeIdx = -1;           // force a screen re-render (language switch)
  includeScroll();
}

/* Real captures per chapter (assets/include-N.webp). Two <img> layers:
 * the incoming one fades in over the outgoing one. */
let shotLayer = 0;
/** URL of a chapter capture: per-language when it exists, else the shared one. */
function includeShotUrl(idx, shared) {
  // ?v= is the build id (stamped by build.sh) so a redeploy is never served
  // from a stale cache - including a cached 404 for a per-language file
  // that has since been added.
  return shared
    ? `/assets/include-${idx + 1}.webp?v=${BUILD_ID}`
    : `/assets/include-${idx + 1}-${lang}.webp?v=${BUILD_ID}`;
}

/**
 * Warm the chapter captures for the CURRENT language.
 *
 * Without this the first chapter change cross-fades to a layer whose image
 * has not arrived yet: you see the empty layer, then the image pops in. Later
 * changes look right only because the file is cached by then.
 */
function preloadIncludeShots() {
  const warm = () => t('include_items').forEach((_, i) => {
    new Image().src = includeShotUrl(i, false);
  });
  if (window.requestIdleCallback) requestIdleCallback(warm, { timeout: 2000 });
  else setTimeout(warm, 600);   // after the hero has had the network to itself
}

/** Guards the fade against a fast scroll: only the newest request may reveal. */
let shotToken = 0;
function showIncludeScreen(idx) {
  const shots = document.querySelectorAll('.include-shot');
  const next = shots[shotLayer ^= 1], prev = shots[shotLayer ^ 1];
  const token = ++shotToken;
  const reveal = () => {
    if (token !== shotToken) return;   // a later chapter already won
    next.classList.add('is-on');
    prev.classList.remove('is-on');
  };
  next.alt = t('include_items')[idx][0];
  // Swap only once the pixels exist, otherwise the fade shows an empty layer.
  next.onload = reveal;
  next.onerror = () => { next.onerror = null; next.onload = reveal; next.src = includeShotUrl(idx, true); };
  next.src = includeShotUrl(idx, false);
  // A cached image can be complete before onload is ever attached.
  if (next.complete && next.naturalWidth) reveal();
}

// Same frozen-height trick as heroScroll: iOS changes innerHeight while you
// scroll (URL bar), which would make progress jump.
let howVh = innerHeight;
addEventListener('resize', () => { if (innerWidth !== howLastW) { howLastW = innerWidth; howVh = innerHeight; } });
let howLastW = innerWidth;
function howProgress() {
  const runway = document.querySelector('.how-runway');
  const r = runway.getBoundingClientRect();
  return Math.min(Math.max(-r.top / (r.height - howVh), 0), 1);
}

function includeScroll() {
  const cards = [...document.querySelectorAll('.include-card')];
  if (cards.length === 0) return;
  const n = cards.length;
  const p = howProgress();
  const active = Math.min(Math.floor(p * n), n - 1);
  const sub = Math.min(Math.max(p * n - active, 0), 1);
  if (active !== includeIdx) {
    includeIdx = active;
    showIncludeScreen(active);
    cards.forEach((card, i) => {
      const on = i === active;
      card.classList.toggle('is-active', on);
      card.classList.toggle('bg-white', on);
      card.classList.toggle('shadow-xl', on);
      card.classList.toggle('shadow-black/10', on);
      card.classList.toggle('border-black/10', on);
      card.classList.toggle('bg-white/45', !on);
      card.classList.toggle('border-white/60', !on);
    });
    document.querySelectorAll('#include-dots span').forEach((d, i) => d.classList.toggle('is-on', i === active));
  }
}
document.getElementById('include-cards').addEventListener('click', (e) => {
  const card = e.target.closest('.include-card');
  if (!card) return;
  const i = Number(card.dataset.include);
  const n = document.querySelectorAll('.include-card').length;
  const runway = document.querySelector('.how-runway');
  const top = runway.getBoundingClientRect().top + scrollY;
  const span = runway.offsetHeight - innerHeight;
  // land a little INTO the chapter (10%), so the card is active and the chat has begun
  scrollTo({ top: top + span * ((i + 0.1) / n), behavior: 'smooth' });
});
{
  let ticking = false;
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { includeScroll(); ticking = false; }); } }, { passive: true });
  addEventListener('resize', includeScroll);
}

/* ============================ router ============================ */
const views = { home: 'view-home', legal: 'view-legal', share: 'view-share' };
let legalKind = 'privacy';
let shareToken = null;

/* file:// (local preview) can't use pathname routing, so doc routes ride the
 * hash there (#/privacy); hosted, they use real paths (/privacy). */
const FILE_MODE = location.protocol === 'file:';

function currentRoutePath() {
  if (FILE_MODE) {
    const h = location.hash;
    return h.startsWith('#/') ? h.slice(1) : '/';
  }
  return location.pathname.replace(/\/+$/, '') || '/';
}

function route() {
  const path = currentRoutePath();
  const rMatch = path.match(/^\/r\/([0-9a-f-]{36})$/i);
  let view = 'home';
  if (path === '/privacy' || path === '/terms') { view = 'legal'; legalKind = path.slice(1); }
  else if (rMatch) { view = 'share'; shareToken = rMatch[1]; }
  Object.values(views).forEach((id) => document.getElementById(id).classList.add('hidden'));
  document.getElementById(views[view]).classList.remove('hidden');
  if (view === 'legal') renderLegal();
  if (view === 'share') loadShare();
  window.scrollTo(0, 0);
}

function goTo(dest) {
  const [path, anchor] = dest.split('#');
  // Same-page section anchor: make sure home is visible, then scroll.
  if (anchor) {
    if (currentRoutePath() !== '/') {
      if (FILE_MODE) history.replaceState({}, '', location.pathname);
      else history.pushState({}, '', '/');
      route();
    }
    document.getElementById(anchor)?.scrollIntoView({ behavior: 'instant', block: 'start' });
    return;
  }
  // Document route (/, /privacy, /terms).
  if (FILE_MODE) {
    history.pushState({}, '', location.pathname + (path === '/' ? '' : `#${path}`));
  } else {
    history.pushState({}, '', path || '/');
  }
  route();
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-nav]');
  if (!a) return;
  e.preventDefault();
  goTo(a.dataset.nav);
});
window.addEventListener('popstate', route);
window.addEventListener('hashchange', () => { if (FILE_MODE) route(); });

/* ============================ share ============================ */
let shareLoaded = null;
function renderShareTexts() { if (shareLoaded) renderShareRecipe(shareLoaded); }
async function loadShare() {
  const loading = document.getElementById('share-loading');
  const failed = document.getElementById('share-failed');
  const box = document.getElementById('share-recipe');
  loading.classList.remove('hidden'); failed.classList.add('hidden'); box.classList.add('hidden');
  try {
    const res = await fetch(SHARE_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: shareToken, action: 'get', language: lang }),
    });
    if (!res.ok) throw new Error(String(res.status));
    shareLoaded = await res.json();
    renderShareRecipe(shareLoaded);
  } catch {
    loading.classList.add('hidden');
    failed.classList.remove('hidden');
  }
}
function renderShareRecipe(r) {
  document.getElementById('share-loading').classList.add('hidden');
  document.getElementById('share-recipe').classList.remove('hidden');
  const img = document.getElementById('share-img');
  if (r.image_path) { img.src = RECIPE_IMG + r.image_path; img.classList.remove('hidden'); }
  document.getElementById('share-title').textContent = r.title;
  document.getElementById('share-meta').textContent =
    (r.calories != null ? `${Math.round(r.calories)} kcal · ` : '') + T[lang].servings(r.servings);
  document.getElementById('share-open').href = `safran://shared-recipe/${shareToken}`;
}

/* ============================ motion ============================ */
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const io = new IntersectionObserver(
  (entries) => entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }),
  { threshold: 0.15 }
);
function observeReveal(el) { io.observe(el); }
document.querySelectorAll('[data-reveal],[data-panel]').forEach(observeReveal);
{
  const deck = document.getElementById('infl-grid');
  if (deck) {
    if (reduced) deck.classList.add('is-open');
    else new IntersectionObserver((es, obs) => es.forEach((e) => { if (e.isIntersecting) { deck.classList.add('is-open'); obs.disconnect(); } }), { threshold: 0.35 }).observe(deck);
  }
}

/* Parallax. Offset derives from the PARENT's viewport position (the parent
 * is unaffected by this element's transform, so no feedback loop) and moves
 * continuously through [-speed*200, +speed*200] — the template's scrollY
 * modulo snapped every 600px and clobbered layout transforms. */
if (!reduced) {
  const layers = document.querySelectorAll('[data-parallax]');
  let ticking = false;
  const applyParallax = () => {
    layers.forEach((el) => {
      const parent = el.parentElement || el;
      const rect = parent.getBoundingClientRect();
      if (rect.bottom < -100 || rect.top > innerHeight + 100) return;
      const speed = parseFloat(el.dataset.parallax);
      const progress = (innerHeight - rect.top) / (innerHeight + rect.height);
      const clamped = Math.min(Math.max(progress, 0), 1);
      el.style.transform = `translateY(${((clamped - 0.5) * speed * 400).toFixed(1)}px)`;
    });
    ticking = false;
  };
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(applyParallax); ticking = true; }
  }, { passive: true });
  applyParallax();
}

function wrapWords(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) { if (n.textContent.trim() !== '') nodes.push(n); }
  let i = 0;
  nodes.forEach((tn) => {
    const parts = tn.textContent.split(/(\s+)/);
    const frag = document.createDocumentFragment();
    parts.forEach((part) => {
      if (part.trim() === '') { frag.appendChild(document.createTextNode(part)); return; }
      const span = document.createElement('span');
      span.className = 'word-reveal';
      span.style.transitionDelay = `${i * 45}ms`;
      span.textContent = part;
      frag.appendChild(span);
      i++;
    });
    tn.parentNode.replaceChild(frag, tn);
  });
}
